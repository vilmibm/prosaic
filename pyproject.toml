[project]
name = "prosaic"
version = "6.2.0"
description="prose scraper and cut-up poetry generator"
readme = "README.md"
authors = [
  { name = "nate smith", email = "vilmibm@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
  "nltk==3.8.1",
  "numpy==1.26.4",
  "SQLAlchemy==1.4.46",
  "pyhocon==0.3.29",
  "psycopg2-binary==2.9.10",
]
url = "https://github.com/vilmibm/prosaic"

[project.scripts]
prosaic = "prosaic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prosaic"]
include = ["src/prosaic/templates/*.json"]
